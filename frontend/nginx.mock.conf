# The standalone frontend demo has no backend API.
location /ml-api/ {
    proxy_pass http://ml:8001/;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
}

location /api/ {
    default_type application/json;
    return 503 '{"message":"API is not included in this frontend demo."}';
}
