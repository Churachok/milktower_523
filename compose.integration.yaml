# Team integration contract. Backend / ML owners add their Dockerfiles and code.
# docker compose --parallel 1 -f compose.yaml -f compose.integration.yaml up --build -d --wait --wait-timeout 180
services:
  frontend:
    image: milk-tower-frontend:integration
    build:
      target: integration
    cpus: 0.5
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ${BACKEND_IMAGE:-milk-tower-backend:local}
    build:
      context: ./backend
    expose:
      - "8000"
    environment:
      PORT: "8000"
      DATA_DIR: /data
      ML_BASE_URL: http://ml:8001
    volumes:
      - backend-data:/data
    depends_on:
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "2", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 256m
    pids_limit: 128
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  ml:
    image: ${ML_IMAGE:-milk-tower-ml:local}
    build:
      context: ./ml
    expose:
      - "8001"
    environment:
      PORT: "8001"
      ML_DEVICE: cpu
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      XDG_CACHE_HOME: /cache
      HF_HOME: /cache/huggingface
    volumes:
      - ml-cache:/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 6
    cpus: 2.0
    mem_limit: 3g
    mem_reservation: 512m
    pids_limit: 256
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  backend-data:
  ml-cache:
