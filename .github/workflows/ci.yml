name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=1024
      VITE_API_MODE: mock
      VITE_API_BASE_URL: /api/v1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check submission files and Git ignore policy
        run: node scripts/check-repository.mjs
      - name: Install dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Test application behavior
        run: npm test --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Validate Compose
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.integration.yaml config --quiet
          docker compose -f compose.yaml -f compose.integration.yaml -f compose.gpu.yaml config --quiet
      - name: Build and start Docker application
        run: docker compose up --build -d --wait --wait-timeout 60
      - name: Check Nginx and HTTP responses
        run: |
          docker compose exec -T frontend nginx -t
          node scripts/smoke.mjs
      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop Docker application
        if: always()
        run: docker compose down
