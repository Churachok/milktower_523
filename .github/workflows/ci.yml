name: CI

"on":
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCARF_ANALYTICS: "false"
      NODE_OPTIONS: --max-old-space-size=1024
      VITE_API_MODE: http
      VITE_API_BASE_URL: /api/v1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Identify the exact build
        run: echo "BUILD_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Check submission files and Git ignore policy
        run: node scripts/check-repository.mjs
      - name: Install dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Test application behavior
        run: npm test --prefix frontend
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.12'
      - name: Test scoring and local HTTP contract
        run: python -m unittest discover -s ml/tests -v
        env:
          PYTHONPATH: ml
      - name: Install backend dependencies
        run: |
          python -m pip install uv==0.13.5
          uv sync --project backend --frozen
      - name: Test backend with the real ML HTTP service
        working-directory: backend
        run: |
          uv run pytest -q
          uv run ruff check .
      - name: Test optional ML API without external calls
        run: |
          python -m venv /tmp/ml-ai
          /tmp/ml-ai/bin/pip install -r ml/requirements.lock
          /tmp/ml-ai/bin/python -m unittest discover -s ml/ai_tests -v
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Validate Compose
        run: |
          docker compose config --quiet
          docker compose -f compose.demo.yaml config --quiet
          PUBLIC_HOST=demo.example REVIEWER_PASSWORD_HASH=placeholder docker compose -f compose.yaml -f compose.server.yaml config --quiet
          docker compose -f compose.yaml -f compose.ai.yaml config --quiet
          docker compose -f compose.yaml -f compose.integration.yaml config --quiet
          docker compose -f compose.yaml -f compose.integration.yaml -f compose.gpu.yaml config --quiet
      - name: Build and start Docker application
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Check Nginx and HTTP responses
        run: |
          docker compose exec -T frontend nginx -t
          node scripts/smoke.mjs
      - name: Confirm persistence across container restart
        run: |
          docker compose restart backend
          docker compose up -d --wait --wait-timeout 90
          node scripts/integration-smoke.mjs http://127.0.0.1:8080 --verify-persisted
      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop Docker application
        if: always()
        run: docker compose down
